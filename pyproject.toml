[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "braincell"
description = "Biologically Detailed Brain Cell Modeling in BrainX"
readme = "README.md"
keywords = [
  "brain modeling",
  "dendritic computation",
  "dendritic modeling",
  "neuron simulation",
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
authors = [ { name = "BrainCell Developers", email = "chao.brain@qq.com" } ]
requires-python = ">=3.11"
classifiers = [
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries",
]
dynamic = [ "version" ]
# Runtime dependencies. `jax` and `scipy` are intentionally left unpinned:
# docs/design/TODO.md section 8 specifies "recent" for both, and braincell must not
# constrain which JAX backend build (CPU / CUDA / TPU) a user installs.
dependencies = [
  "brainevent>=0.0.7",
  "brainpy>=2.7.5",
  # 0.5.4 is the first release that works with jax 0.11.1, which deleted
  # `jax.extend.core.CallPrimitive`; every earlier brainstate imports that name
  # unconditionally and fails at import time. CI installs unpinned jax, so this
  # floor is what keeps `import braincell` working on current JAX.
  "brainstate>=0.5.4",
  "braintools>=0.1",
  "brainunit>=0.0.8",
  "jax",
  "numpy>=2",
  "scipy",
]
# Convenience aggregator: everything a user-facing install might need
optional-dependencies.all = [
  "braincell[io,optim,vis]",
]
# JAX backends. Pick exactly one; they are mutually exclusive.
optional-dependencies.cpu = [ "jax[cpu]" ]
optional-dependencies.cuda12 = [ "jax[cuda12]" ]
optional-dependencies.cuda13 = [ "jax[cuda13]" ]
# Everything needed to develop braincell.
optional-dependencies.dev = [
  "braincell[doc,testing]",
  "pre-commit",
]
# Documentation build (see docs/).
optional-dependencies.doc = [
  "braincell[io,vis]",
  "brainx-sphinx-header>=0.5",
  "jinja2",
  "jupyter-sphinx>=0.5.3",
  "myst-nb",
  "pandoc",
  "sphinx>=9.0.4",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1.2",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design",
  "sphinx-math-dollar",
  "sphinx-remove-toctrees",
  "sphinx-thebe",
]
# NeuroMorpho.Org client in braincell.io.neuromorpho
optional-dependencies.io = [ "requests" ]
# Experimental black-box parameter search through braintools wrappers.
optional-dependencies.optim = [ "nevergrad" ]
# Testing dependencies. pytest-benchmark is optional at runtime -- the
# benchmarks skip themselves when it is absent.
optional-dependencies.testing = [
  "absl-py",
  "braincell[io,vis]",
  "hypothesis",
  "pytest",
  "pytest-benchmark",
]
optional-dependencies.tpu = [ "jax[tpu]" ]
# Visualization: 2D (matplotlib) + 3D (pyvista / plotly) backends.
# These stay optional and lazily imported so `import braincell` remains cheap.
optional-dependencies.vis = [
  "matplotlib",
  "networkx",
  "plotly",
  "pyvista",
]
urls."Bug Tracker" = "https://github.com/chaobrain/braincell/issues"
urls."Source Code" = "https://github.com/chaobrain/braincell"
urls.Documentation = "https://brainx.chaobrain.com/braincell/"
urls.Homepage = "https://github.com/chaobrain/braincell"
scripts.braincell-neuromorpho = "braincell.io.neuromorpho.cli:main"

[tool.setuptools]
packages.find.exclude = [
  "benchmarks*",
  "braincell.egg-info*",
  "braincell/__pycache__*",
  "build*",
  "data*",
  "dev*",
  "develop*",
  "dist*",
  "docs*",
  "examples*",
  "legacy*",
  "tests*",
  "validation*"
]
# PEP 561: ship inline type information to downstream type checkers.
package-data.braincell = [ "py.typed" ]
dynamic.version = { attr = "braincell._version.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [ "benchmarks", "data", "dev", "docs", "examples", "validation" ]
# `preserve` keeps the codebase's existing mix of single and double quotes
# so the initial formatting pass does not churn every string literal.
format.quote-style = "preserve"
# Ruff's default rule set (pycodestyle errors + pyflakes). Import sorting (I)
# and pyupgrade (UP) are deliberately NOT enabled yet.
#
# Every code below is a rule the current tree violates. This pass is
# format-and-trivial only, so each is silenced rather than mass-fixed, and each
# is listed with its violation count at the time of writing so the debt is
# auditable. Delete an entry once its cleanup lands; none of them are silenced
# because the rule is wrong.
lint.select = [ "E4", "E7", "E9", "F" ]
lint.ignore = [
  # 145x -- lambda assigned to a variable. Pervasive and stylistic.
  "E731",
  # 2x -- "ambiguous" names l/I/O. In this codebase `I` means current and is
  # domain-meaningful; blanket-renaming would hurt readability.
  "E741",
]
# `__init__.py` files are re-export hubs: every name they import is part of the
# package's public surface and is re-exported through `__all__`, so pyflakes'
# unused-import rule reports the whole surface as dead. Nowhere else in the tree
# is F401 silenced -- an unused import in a real module is still an error.
lint.per-file-ignores."**/__init__.py" = [ "F401" ]

[tool.pytest]
ini_options.testpaths = [ "braincell" ]
# NOTE: norecursedirs REPLACES pytest's built-in ignore list rather than
# extending it, so the defaults are restated here alongside the
# braincell-specific entries.
ini_options.norecursedirs = [
  "*.egg",
  ".*",
  "_darcs",
  "{arch}",
  "build",
  "CVS",
  "dev",
  "develop",
  "dist",
  "docs",
  "legacy",
  "node_modules",
  "venv",
]
# Inside the `braincell` package every test module is a co-located
# `<module>_test.py` sibling of the code it covers, and the stem must name a
# real sibling module -- see AGENTS.md. The sole exception is a package-scope
# guard, which lives in `<package>/__init___test.py`. pytest's default
# `test_*.py` is kept enabled as well, because the out-of-package suite at
# validation/neuron/{cable,channel_no_conc}/tests/ uses that convention; cable is run
# directly by CI. Note that a bare `test.py` matches neither pattern and is
# silently skipped; that is what hid 72 SWC/ASC tests until the io/swc and
# io/asc suites were renamed to `reader_test.py`.
ini_options.python_files = [ "*_test.py", "test_*.py" ]
# python_classes is left at pytest's default (`Test*`) on purpose. Every real
# test class here subclasses unittest.TestCase and is collected regardless of
# the pattern; adding a `*Test` suffix pattern would wrongly collect mixin
# templates such as `_MixedPotassiumCalciumTemplateTest`, which set `CLS = None`
# and are only valid once combined with TestCase in a concrete subclass.
ini_options.python_functions = [ "test_*" ]

[tool.coverage]
run.branch = true
run.omit = [
  "*_test.py",
  "braincell/_version.py",
]
run.source = [ "braincell" ]
report.exclude_also = [
  "@overload",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
