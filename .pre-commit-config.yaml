# Install or update the hooks with:
#   pre-commit install
#   pre-commit autoupdate
# Run them manually across the whole repository with:
#   pre-commit run --all-files
#
# Ruff configuration (line length, rule selection, format style) lives in
# pyproject.toml under [tool.ruff]; it is deliberately NOT duplicated here.

default_language_version:
  python: python3

exclude: |
  (?x)^(
      docs/.*|
      examples/.*|
      benchmarks/.*|
      validation/.*|
      data/.*|
      dev/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
        types: [python]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      # Lint with the minimal rule set selected in [tool.ruff.lint].
      # --fix is intentionally omitted: the current pass is format-and-trivial
      # only, so nothing here rewrites code semantics.
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.27.1
    hooks:
      - id: pyproject-fmt
